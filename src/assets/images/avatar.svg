<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Glow Base -->
  <circle cx="200" cy="200" r="180" fill="url(#avatarBg)" opacity="0.2" filter="blur(20px)" />
  <circle cx="200" cy="200" r="170" fill="#0f172a" stroke="url(#avatarBg)" stroke-width="4" />

  <!-- Code Graphic Backdrop -->
  <text x="70" y="110" fill="#38bdf8" opacity="0.4" font-family="monospace" font-size="14">&lt;const Fibin = () =&gt;</text>
  <text x="90" y="135" fill="#818cf8" opacity="0.4" font-family="monospace" font-size="14">return &lt;FullStack /&gt;</text>
  <text x="70" y="160" fill="#c084fc" opacity="0.4" font-family="monospace" font-size="14">&lt;/code&gt;</text>

  <!-- Developer Silhouette / Illustration -->
  <g filter="url(#glow)">
    <!-- Shoulders -->
    <path d="M 80,350 C 80,270 140,240 200,240 C 260,240 320,270 320,350 Z" fill="#1e293b" stroke="url(#avatarBg)" stroke-width="2" />
    <!-- Hoodie Accent -->
    <path d="M 150,240 Q 200,290 250,240 L 220,350 L 180,350 Z" fill="url(#avatarBg)" opacity="0.8" />
    
    <!-- Face / Head -->
    <circle cx="200" cy="170" r="55" fill="#334155" />

    <!-- Glasses -->
    <rect x="160" y="155" width="32" height="22" rx="4" fill="none" stroke="#38bdf8" stroke-width="3" />
    <rect x="208" y="155" width="32" height="22" rx="4" fill="none" stroke="#38bdf8" stroke-width="3" />
    <line x1="192" y1="166" x2="208" y2="166" stroke="#38bdf8" stroke-width="3" />
    <line x1="145" y1="166" x2="160" y2="166" stroke="#38bdf8" stroke-width="3" />
    <line x1="240" y1="166" x2="255" y2="166" stroke="#38bdf8" stroke-width="3" />

    <!-- Smile -->
    <path d="M 185,195 Q 200,208 215,195" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
