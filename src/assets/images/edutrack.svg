<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="300" fill="#6366f1" opacity="0.1" filter="blur(60px)" />
  <circle cx="1000" cy="600" r="250" fill="#a855f7" opacity="0.1" filter="blur(60px)" />

  <!-- App Window Container -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <rect width="1080" height="650" rx="16" fill="#1e293b" opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    
    <!-- Window Header Bar -->
    <rect width="1080" height="48" rx="16" fill="#0f172a" />
    <rect y="32" width="1080" height="16" fill="#0f172a" />
    <circle cx="30" cy="24" r="6" fill="#ef4444" />
    <circle cx="50" cy="24" r="6" fill="#f59e0b" />
    <circle cx="70" cy="24" r="6" fill="#10b981" />
    <text x="540" y="29" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">EduTrack — School Management System</text>

    <!-- Sidebar -->
    <rect x="0" y="48" width="220" height="602" fill="#0f172a" opacity="0.7" />
    <rect x="20" y="80" width="140" height="32" rx="6" fill="url(#accentGrad)" />
    <text x="35" y="101" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">🎓 EduTrack Pro</text>

    <!-- Sidebar Menu Items -->
    <rect x="15" y="140" width="190" height="40" rx="8" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
    <text x="35" y="165" fill="#818cf8" font-family="sans-serif" font-size="13" font-weight="600">📊 Dashboard</text>
    
    <text x="35" y="215" fill="#94a3b8" font-family="sans-serif" font-size="13">👨‍🎓 Students Directory</text>
    <text x="35" y="260" fill="#94a3b8" font-family="sans-serif" font-size="13">📚 Attendance Tracker</text>
    <text x="35" y="305" fill="#94a3b8" font-family="sans-serif" font-size="13">📝 Examinations &amp; Grades</text>
    <text x="35" y="350" fill="#94a3b8" font-family="sans-serif" font-size="13">💳 Fee Management</text>
    <text x="35" y="395" fill="#94a3b8" font-family="sans-serif" font-size="13">⚙️ System Settings</text>

    <!-- Main Content Area -->
    <!-- Top Stats Cards -->
    <g transform="translate(250, 75)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="245" height="110" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Total Active Students</text>
      <text x="20" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">2,845</text>
      <rect x="170" y="20" width="55" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" />
      <text x="197" y="36" fill="#34d399" font-family="sans-serif" font-size="11" text-anchor="middle">+14%</text>

      <!-- Card 2 -->
      <rect x="265" y="0" width="245" height="110" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="285" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Daily Attendance Rate</text>
      <text x="285" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">96.8%</text>
      <rect x="435" y="20" width="55" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" />
      <text x="462" y="36" fill="#34d399" font-family="sans-serif" font-size="11" text-anchor="middle">+2.1%</text>

      <!-- Card 3 -->
      <rect x="530" y="0" width="245" height="110" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="550" y="32" fill="#94a3b8" font-family="sans-serif" font-size="12">Fee Collections (YTD)</text>
      <text x="550" y="70" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="bold">$142.8k</text>
      <rect x="700" y="20" width="55" height="24" rx="12" fill="rgba(99, 102, 241, 0.15)" />
      <text x="727" y="36" fill="#818cf8" font-family="sans-serif" font-size="11" text-anchor="middle">98%</text>
    </g>

    <!-- Analytics Chart Area -->
    <g transform="translate(250, 210)">
      <rect x="0" y="0" width="510" height="380" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="20" y="35" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="600">Academic Growth &amp; Attendance Analytics</text>
      
      <!-- Chart Area Grid Lines -->
      <line x1="40" y1="80" x2="470" y2="80" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4" />
      <line x1="40" y1="140" x2="470" y2="140" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4" />
      <line x1="40" y1="200" x2="470" y2="200" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4" />
      <line x1="40" y1="260" x2="470" y2="260" stroke="rgba(255,255,255,0.05)" stroke-dasharray="4" />

      <!-- Smooth Line Chart -->
      <path d="M 40,240 Q 110,180 180,210 T 320,110 T 470,85 L 470,300 L 40,300 Z" fill="url(#chartGrad)" />
      <path d="M 40,240 Q 110,180 180,210 T 320,110 T 470,85" fill="none" stroke="#6366f1" stroke-width="4" />
      
      <!-- Data Points -->
      <circle cx="180" cy="210" r="5" fill="#ffffff" stroke="#6366f1" stroke-width="3" />
      <circle cx="320" cy="110" r="5" fill="#ffffff" stroke="#6366f1" stroke-width="3" />
      <circle cx="470" cy="85" r="5" fill="#ffffff" stroke="#6366f1" stroke-width="3" />

      <!-- Month Labels -->
      <text x="40" y="330" fill="#64748b" font-family="sans-serif" font-size="11">Jan</text>
      <text x="125" y="330" fill="#64748b" font-family="sans-serif" font-size="11">Feb</text>
      <text x="210" y="330" fill="#64748b" font-family="sans-serif" font-size="11">Mar</text>
      <text x="295" y="330" fill="#64748b" font-family="sans-serif" font-size="11">Apr</text>
      <text x="380" y="330" fill="#64748b" font-family="sans-serif" font-size="11">May</text>
      <text x="465" y="330" fill="#64748b" font-family="sans-serif" font-size="11">Jun</text>
    </g>

    <!-- Recent Activity / Grade Table -->
    <g transform="translate(780, 210)">
      <rect x="0" y="0" width="265" height="380" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="20" y="35" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="600">Top Students</text>

      <!-- Student Items -->
      <g transform="translate(20, 60)">
        <circle cx="20" cy="20" r="16" fill="#3b82f6" />
        <text x="20" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">AS</text>
        <text x="48" y="17" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Alex Smith</text>
        <text x="48" y="32" fill="#64748b" font-family="sans-serif" font-size="11">Grade 12-A • GPA 3.95</text>
      </g>
      <line x1="20" y1="115" x2="245" y2="115" stroke="rgba(255,255,255,0.05)" />

      <g transform="translate(20, 130)">
        <circle cx="20" cy="20" r="16" fill="#10b981" />
        <text x="20" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">EJ</text>
        <text x="48" y="17" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Emily Johnson</text>
        <text x="48" y="32" fill="#64748b" font-family="sans-serif" font-size="11">Grade 11-B • GPA 3.90</text>
      </g>
      <line x1="20" y1="185" x2="245" y2="185" stroke="rgba(255,255,255,0.05)" />

      <g transform="translate(20, 200)">
        <circle cx="20" cy="20" r="16" fill="#f59e0b" />
        <text x="20" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">MD</text>
        <text x="48" y="17" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Michael Davis</text>
        <text x="48" y="32" fill="#64748b" font-family="sans-serif" font-size="11">Grade 10-C • GPA 3.88</text>
      </g>
      <line x1="20" y1="255" x2="245" y2="255" stroke="rgba(255,255,255,0.05)" />

      <g transform="translate(20, 270)">
        <circle cx="20" cy="20" r="16" fill="#a855f7" />
        <text x="20" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">SL</text>
        <text x="48" y="17" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Sophia Lee</text>
        <text x="48" y="32" fill="#64748b" font-family="sans-serif" font-size="11">Grade 12-A • GPA 3.98</text>
      </g>
    </g>
  </g>
</svg>
