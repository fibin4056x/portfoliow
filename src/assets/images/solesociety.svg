<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <circle cx="1000" cy="150" r="300" fill="#f43f5e" opacity="0.12" filter="blur(70px)" />
  <circle cx="200" cy="600" r="280" fill="#fb923c" opacity="0.1" filter="blur(70px)" />

  <!-- App Window Container -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <rect width="1080" height="650" rx="16" fill="#18181b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <!-- Window Top Header -->
    <rect width="1080" height="48" rx="16" fill="#09090b" />
    <rect y="32" width="1080" height="16" fill="#09090b" />
    <circle cx="30" cy="24" r="6" fill="#ef4444" />
    <circle cx="50" cy="24" r="6" fill="#f59e0b" />
    <circle cx="70" cy="24" r="6" fill="#10b981" />
    <text x="540" y="29" fill="#a1a1aa" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Sole Society — Premium Sneaker Store</text>

    <!-- Navigation Bar inside app -->
    <rect x="0" y="48" width="1080" height="60" fill="#18181b" border-bottom="1px solid #27272a" />
    <text x="40" y="85" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" letter-spacing="1">SOLE<tspan fill="#f43f5e">SOCIETY</tspan></text>
    
    <text x="320" y="83" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">New Releases</text>
    <text x="440" y="83" fill="#a1a1aa" font-family="sans-serif" font-size="13">Men</text>
    <text x="510" y="83" fill="#a1a1aa" font-family="sans-serif" font-size="13">Women</text>
    <text x="590" y="83" fill="#a1a1aa" font-family="sans-serif" font-size="13">Collections</text>
    <text x="690" y="83" fill="#a1a1aa" font-family="sans-serif" font-size="13">Sale</text>

    <!-- Search & Cart -->
    <rect x="820" y="63" width="160" height="32" rx="16" fill="#27272a" />
    <text x="840" y="84" fill="#71717a" font-family="sans-serif" font-size="12">🔍 Search sneakers...</text>
    <circle cx="1020" cy="79" r="16" fill="#f43f5e" />
    <text x="1020" y="84" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3</text>

    <!-- Hero Banner inside app -->
    <g transform="translate(40, 125)">
      <rect width="1000" height="180" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="40" y="55" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">SUMMER DROP 2026</text>
      <text x="40" y="95" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="900">AIR RETRO MAX PRO 'NEON'</text>
      <text x="40" y="125" fill="#a1a1aa" font-family="sans-serif" font-size="13">Ultra-lightweight mesh with responsive air cushion technology.</text>

      <rect x="40" y="138" width="130" height="32" rx="8" fill="url(#glowGrad)" />
      <text x="105" y="159" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Shop Drop ($220)</text>

      <!-- Decorative Sneaker Art -->
      <path d="M 720,130 C 680,100 750,50 820,60 C 880,70 940,110 920,140 C 900,165 780,160 720,130 Z" fill="#f43f5e" opacity="0.8" />
      <path d="M 700,140 L 940,140 L 920,155 L 680,155 Z" fill="#ffffff" />
    </g>

    <!-- Product Grid -->
    <g transform="translate(40, 325)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="315" height="300" rx="12" fill="#27272a" opacity="0.7" stroke="rgba(255,255,255,0.06)" />
      <rect x="15" y="15" width="285" height="170" rx="8" fill="#18181b" />
      <path d="M 60,120 Q 150,70 240,110 L 250,135 L 50,135 Z" fill="#fb923c" />
      <rect x="25" y="25" width="50" height="20" rx="4" fill="#f43f5e" />
      <text x="50" y="39" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HOT</text>
      <text x="20" y="215" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Cyber Runner V2</text>
      <text x="20" y="235" fill="#a1a1aa" font-family="sans-serif" font-size="12">Streetwear / Limited</text>
      <text x="20" y="275" fill="#f43f5e" font-family="sans-serif" font-size="18" font-weight="900">$185</text>
      <rect x="220" y="250" width="80" height="32" rx="6" fill="#f43f5e" />
      <text x="260" y="271" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add</text>

      <!-- Item 2 -->
      <rect x="342" y="0" width="315" height="300" rx="12" fill="#27272a" opacity="0.7" stroke="rgba(255,255,255,0.06)" />
      <rect x="357" y="15" width="285" height="170" rx="8" fill="#18181b" />
      <path d="M 400,120 Q 490,60 580,105 L 590,135 L 390,135 Z" fill="#38bdf8" />
      <text x="362" y="215" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Phantom High OG</text>
      <text x="362" y="235" fill="#a1a1aa" font-family="sans-serif" font-size="12">Basketball / Leather</text>
      <text x="362" y="275" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="900">$210</text>
      <rect x="562" y="250" width="80" height="32" rx="6" fill="#38bdf8" />
      <text x="602" y="271" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add</text>

      <!-- Item 3 -->
      <rect x="685" y="0" width="315" height="300" rx="12" fill="#27272a" opacity="0.7" stroke="rgba(255,255,255,0.06)" />
      <rect x="700" y="15" width="285" height="170" rx="8" fill="#18181b" />
      <path d="M 740,125 Q 830,75 920,115 L 930,135 L 730,135 Z" fill="#a855f7" />
      <text x="705" y="215" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Urban Glide Stealth</text>
      <text x="705" y="235" fill="#a1a1aa" font-family="sans-serif" font-size="12">Minimalist / Daily</text>
      <text x="705" y="275" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="900">$165</text>
      <rect x="905" y="250" width="80" height="32" rx="6" fill="#a855f7" />
      <text x="945" y="271" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">+ Add</text>
    </g>
  </g>
</svg>
